<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五年級英語考試準備整理</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #e6f7ff; /* 淡藍色背景 */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: white;
            max-width: 600px;
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #0056b3; /* 深藍色標題 */
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-bottom: 3px solid #0056b3;
            padding-bottom: 10px;
        }
        .item-card {
            background-color: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 15px;
            padding: 15px;
            transition: transform 0.2s;
        }
        .item-card:hover {
            border-color: #0056b3;
            transform: translateY(-2px);
        }
        .item-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: block;
            color: #333;
        }
        .tag {
            display: inline-block;
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 12px;
            margin-right: 8px;
            color: white;
            vertical-align: middle;
        }
        .tag-audio { background-color: #20B2AA; } /* 藍綠色 */
        .tag-exam { background-color: #FF5722; }  /* 深橘色 */

        audio {
            width: 100%;
            height: 40px;
            margin-top: 5px;
        }

        .game-btn {
            display: block;
            text-align: center;
            background-color: #FF5722;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .game-btn:hover {
            background-color: #e64a19;
        }
        
        .divider {
            margin: 20px 0;
            border-top: 2px dashed #ccc;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>五年級英語考試準備整理</h1>

    <div class="item-card">
        <span class="item-title"><span class="tag tag-audio">聽力</span>(1) U1 單字</span>
        <audio controls src="u1_words.mp3"></audio>
    </div>

    <div class="item-card">
        <span class="item-title"><span class="tag tag-audio">聽力</span>(2) 口試課本 p.14, 22, 23, 28</span>
        <audio controls src="oral_p14.mp3"></audio>
    </div>

    <div class="item-card">
        <span class="item-title"><span class="tag tag-audio">聽力</span>(3) U2 單字</span>
        <audio controls src="u2_words.mp3"></audio>
    </div>

    <div class="item-card">
        <span class="item-title"><span class="tag tag-audio">聽力</span>(4) 口試課本 p.36, 37, 42</span>
        <audio controls src="oral_p36.mp3"></audio>
    </div>

    <div class="divider"></div>

    <div class="item-card">
        <span class="item-title"><span class="tag tag-exam">測驗</span>(5) 期中複習考</span>
        <a href="https://wordwall.net/teacher/9945855/folder/3552582/%E5%9C%8B%E5%B0%8F%E8%8B%B1%E8%AA%9E/wonder-world-5/review-1">點擊開始測驗/遊戲 🎮</a>
    </div>

    <div class="divider"></div>

    <div class="item-card">
        <span class="item-title"><span class="tag tag-audio">聽力</span>(6) U3 單字</span>
        <audio controls src="u3_words.mp3"></audio>
    </div>

    <div class="item-card">
        <span class="item-title"><span class="tag tag-audio">聽力</span>(7) 口試課本 p.54, 55, 60</span>
        <audio controls src="oral_p54.mp3"></audio>
    </div>

    <div class="item-card">
        <span class="item-title"><span class="tag tag-audio">聽力</span>(8) U4 單字</span>
        <audio controls src="u4_words.mp3"></audio>
    </div>

    <div class="item-card">
        <span class="item-title"><span class="tag tag-audio">聽力</span>(9) 口試課本 p.68, 69, 74</span>
        <audio controls src="oral_p68.mp3"></audio>
    </div>

    <div class="divider"></div>

    <div class="item-card">
        <span class="item-title"><span class="tag tag-exam">測驗</span>(10) 期末複習考</span>
        <a href="https://wordwall.net/teacher/9945855/folder/3552585/%E5%9C%8B%E5%B0%8F%E8%8B%B1%E8%AA%9E/wonder-world-5/review-2">點擊開始測驗/遊戲 🎮</a>
    </div>

</div>

</body>
</html>
